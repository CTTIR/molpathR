url: https://cttir.github.io/molpathR/

template:
  package: themakR

development:
  mode: auto
navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github]

reference:
  - title: "Parsers"
    desc: "Functions for reading molecular pathology data files"
    contents:
      - mp_read_vcf
      - mp_read_fastq
      - mp_read_bam
      - mp_read_xml_report
      - mp_read_pdf_report
      - mp_read_nexus_pathology
      - mp_read_nexus_clinical
      - mp_read_survival
      - mp_read_auto

  - title: "Database"
    desc: "Build and manage the in-memory database"
    contents:
      - mp_build_db
      - mp_add_data
      - mp_merge_db
      - mp_validate_db
      - mp_save_db
      - mp_load_db

  - title: "Queries"
